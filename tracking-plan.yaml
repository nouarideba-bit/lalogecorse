# Plan de suivi — La Loge Corse
# Source de vérité des événements. Toute modification passe par ce fichier
# (puis delta.md et changelog.md).

meta:
  product: "La Loge Corse"
  version: 1
  created: 2026-10-05
  updated: 2026-10-05
  owner: "nouarideba-bit (dépôt lalogecorse)"
  implementation: posthog
  destinations: [posthog]
  posthog_region: eu            # PostHog Cloud UE (eu.i.posthog.com)
  naming_convention: "object.action (snake_case), propriétés en snake_case"
  pii_policy: none              # aucune donnée personnelle : ni nom, ni e-mail, ni téléphone (référents comme invités)
  internal_user_policy: by_flag # partenaire marqué is_internal + liste de tests en configuration : rien n'est envoyé
  identity_model: account_level # événements sans profil personne ; distinct_id = partner_id
  primary_value_event: invitation_request.approved
  season: "2026-27"

# -----------------------------------------
# Entités : personnes
# -----------------------------------------
# Aucune personne n'est suivie individuellement :
#  - politique « aucune donnée personnelle » ;
#  - un compte espace partenaire = une société = un référent ;
#  - les invités et l'administrateur n'ont pas de compte.
# Tous les événements sont envoyés sans profil personne
# ($process_person_profile = false), avec distinct_id = partner_id.

entities:
  user:
    tracked: false
    reason: "Suivi au niveau du partenaire uniquement (pii_policy: none, 1 référent par société)."
    traits: []

# -----------------------------------------
# Groupes
# -----------------------------------------

groups:
  - type: partner
    id_format: "prt_<slug>"     # slug stable dérivé de la liste fixe des sociétés, ex. prt_elydan, prt_city_securite
    is_top_level: true
    description: "Entreprise partenaire de la loge."
    group_call_triggers:
      - "Création : première inscription espace (partner.signed_up) ou première demande via le formulaire public"
      - "Changement : activation du compte, changement de formule ou du statut interne (fichier de configuration)"
      - "Après chaque demande et chaque décision : recalcul des compteurs de saison depuis donnees-loge/"
    traits:
      # Classification
      - name: name
        type: string
        required: true
        update: on_change
        description: "Nom de la société (personne morale, pas une donnée personnelle)."
      - name: formula
        type: string
        enum: [2_guests, 4_guests, 6_guests]
        required: false
        update: on_change
        description: "Formule souscrite, renseignée à la main dans la configuration (vendue hors ligne)."
      - name: is_internal
        type: boolean
        required: true
        update: on_change
        description: "true pour « La Loge Corse & Kalliste Partners » : aucun événement envoyé."
      - name: has_partner_account
        type: boolean
        required: true
        update: on_change
        description: "La société a un compte actif dans l'espace partenaire."
      # Dates de cycle de vie
      - name: signed_up_at
        type: datetime
        required: false
        update: one_time
      - name: activated_at
        type: datetime
        required: false
        update: one_time
      - name: last_request_at
        type: datetime
        required: false
        update: on_change
      - name: last_approved_at
        type: datetime
        required: false
        update: on_change
      # Compteurs de saison (instantanés, calculés depuis la source, jamais déduits des événements)
      - name: requests_season_count
        type: integer
        required: true
        update: on_change
      - name: approved_requests_season_count
        type: integer
        required: true
        update: on_change
      - name: guests_invited_season_count
        type: integer
        required: true
        update: on_change
      - name: guests_checked_in_season_count
        type: integer
        required: false
        update: on_change
        status: planned
        description: "Disponible quand le scan des QR codes existera."

# -----------------------------------------
# Propriétés communes (même sens partout)
# -----------------------------------------
# partner_id        string  "prt_<slug>" — présent sur chaque événement (analyse par partenaire
#                            même sans le module Group analytics de PostHog)
# match_id          string  "<club>-<saison>-<journée>", ex. "pfc-2026-27-j07", "sfp-2026-27-j05"
# club              enum    paris_fc | stade_francais
# match_date        string  date ISO 8601 (AAAA-MM-JJ)
# request_source    enum    public_form | partner_space

events:

  # -- Cycle de vie --

  - name: partner.signed_up
    category: lifecycle
    group_level: partner
    priority: P1
    trigger: "espace.php — création de compte enregistrée (statut « attente »)"
    description: "Une société crée son compte dans l'espace partenaire."
    properties:
      - name: partner_id
        type: string
        required: true
    expected_frequency: low

  - name: partner.activated
    category: lifecycle
    group_level: partner
    priority: P1
    trigger: "espace.php — l'administrateur valide le compte (statut « actif »)"
    description: "Le compte partenaire est validé et peut déposer des demandes."
    properties:
      - name: partner_id
        type: string
        required: true
      - name: hours_to_activation
        type: integer
        required: true
        description: "Délai entre l'inscription et la validation, en heures."
    expected_frequency: low

  # -- Valeur principale --

  - name: invitation_request.submitted
    category: core_value
    group_level: partner
    priority: P1
    trigger: "invitation.php (formulaire public) et espace.php (nouvelle demande), après validation des champs"
    description: "Un partenaire demande des places pour un match."
    properties:
      - name: partner_id
        type: string
        required: true
      - name: request_source
        type: string
        enum: [public_form, partner_space]
        required: true
      - name: match_id
        type: string
        required: true
      - name: club
        type: string
        enum: [paris_fc, stade_francais]
        required: true
      - name: match_date
        type: string
        required: true
      - name: opponent
        type: string
        required: false
        description: "Adversaire, ex. « Stade Rennais FC »."
      - name: guest_count
        type: integer
        required: true
      - name: days_before_match
        type: integer
        required: true
      - name: has_message
        type: boolean
        required: false
    expected_frequency: low

  - name: invitation_request.approved
    category: core_value
    group_level: partner
    priority: P1
    trigger: "espace.php — l'administrateur valide la demande ; les invitations nominatives partent"
    description: "ACTION DE VALEUR PRINCIPALE : la demande est validée et les invitations sont envoyées aux invités."
    properties:
      - name: partner_id
        type: string
        required: true
      - name: request_source
        type: string
        enum: [public_form, partner_space]
        required: true
      - name: match_id
        type: string
        required: true
      - name: club
        type: string
        enum: [paris_fc, stade_francais]
        required: true
      - name: match_date
        type: string
        required: true
      - name: guest_count
        type: integer
        required: true
        description: "Nombre d'invitations nominatives envoyées."
      - name: hours_to_review
        type: integer
        required: true
        description: "Délai entre la demande et la validation, en heures."
      - name: email_failure_count
        type: integer
        required: false
        description: "Invitations dont l'envoi par e-mail a échoué."
    expected_frequency: low

  - name: invitation_request.rejected
    category: core_value
    group_level: partner
    priority: P1
    trigger: "espace.php — l'administrateur refuse la demande"
    description: "La demande est refusée ; aucune invitation n'est envoyée."
    properties:
      - name: partner_id
        type: string
        required: true
      - name: request_source
        type: string
        enum: [public_form, partner_space]
        required: true
      - name: match_id
        type: string
        required: true
      - name: club
        type: string
        enum: [paris_fc, stade_francais]
        required: true
      - name: match_date
        type: string
        required: true
      - name: guest_count
        type: integer
        required: true
      - name: hours_to_review
        type: integer
        required: true
    expected_frequency: low

  # -- Après l'envoi --

  - name: invitation.opened
    category: core_value
    group_level: partner
    priority: P2
    trigger: "espace.php?a=inv — première ouverture d'une invitation par l'invité (pas les suivantes)"
    description: "Un invité ouvre son invitation pour la première fois (signal intermédiaire avant la présence)."
    properties:
      - name: partner_id
        type: string
        required: true
      - name: match_id
        type: string
        required: true
      - name: club
        type: string
        enum: [paris_fc, stade_francais]
        required: true
      - name: days_before_match
        type: integer
        required: true
    expected_frequency: low

  - name: invitation.checked_in
    category: core_value
    group_level: partner
    priority: P3
    status: planned
    trigger: "Scan du QR code à l'entrée (fonction à créer)"
    description: "Un invité est présent au stade : son invitation est scannée à l'entrée."
    properties:
      - name: partner_id
        type: string
        required: true
      - name: match_id
        type: string
        required: true
      - name: club
        type: string
        enum: [paris_fc, stade_francais]
        required: true
    expected_frequency: low

  # -- Erreurs --

  - name: invitation_request.failed
    category: error
    group_level: partner
    priority: P2
    trigger: "invitation.php et espace.php — demande refusée par un contrôle avant enregistrement"
    description: "Un partenaire n'arrive pas à déposer sa demande (friction ou abus)."
    properties:
      - name: partner_id
        type: string
        required: false
        description: "Absent si la société n'a pas pu être reconnue."
      - name: request_source
        type: string
        enum: [public_form, partner_space]
        required: true
      - name: error_type
        type: string
        enum: [missing_fields, invalid_email, invalid_phone, match_unavailable, too_many_guests, no_guest, no_consent, rate_limited, spam_suspected, expired_form]
        required: true
    expected_frequency: low

# -----------------------------------------
# Mise à jour des instantanés
# -----------------------------------------
# Pas de tâche planifiée sur le serveur aujourd'hui : les compteurs sont recalculés
# depuis donnees-loge/ et renvoyés par group() après chaque demande et chaque décision.
# Une tâche quotidienne (cron chez l'hébergeur) pourra s'ajouter plus tard.

snapshot_sync:
  cadence: on_change
  traits:
    - entity: partner
      trait: requests_season_count
      type: integer
      source: "Nombre de demandes de la saison pour ce partenaire (donnees-loge/demandes.json + formulaire public)"
    - entity: partner
      trait: approved_requests_season_count
      type: integer
      source: "Nombre de demandes validées de la saison"
    - entity: partner
      trait: guests_invited_season_count
      type: integer
      source: "Somme des invités des demandes validées de la saison"
    - entity: partner
      trait: guests_checked_in_season_count
      type: integer
      source: "Nombre d'invitations scannées à l'entrée (quand la fonction existera)"
      status: planned

# -----------------------------------------
# Écartés volontairement
# -----------------------------------------
excluded:
  - name: "pages vues / clics du site vitrine"
    reason: "Beaucoup de volume pour peu d'information ; obligerait à un bandeau cookies."
  - name: partnership.inquired
    reason: "Le bouton « Nous contacter » ouvre un e-mail : on ne verrait qu'un clic, pas un vrai contact."
  - name: partner.signed_in
    reason: "Redondant avec les demandes déposées pour un référent unique par société."
  - name: partner.rejected
    reason: "Événement rarissime ; le statut suffit."
  - name: "fiches joueurs, vidéo, calendrier"
    reason: "Contenus de vitrine sans lien avec la valeur (réserver et recevoir ses invités)."

implementation_notes:
  - "Envoi côté serveur depuis PHP (bibliothèque posthog-php ou appel HTTP direct), jamais depuis le navigateur."
  - "Chaque événement : distinct_id = partner_id, $groups = {partner: partner_id}, $process_person_profile = false."
  - "Garde avant envoi : ne rien envoyer si le partenaire est is_internal ou figure dans la liste de tests (configuration)."
  - "Aucun nom, e-mail, téléphone, message libre, clé ou code d'invitation dans les événements."
  - "L'envoi ne doit jamais bloquer ni faire échouer une demande (appel tolérant aux erreurs, délai court)."
  - "Définitions des événements centralisées dans un seul fichier PHP inclus par invitation.php et espace.php."
